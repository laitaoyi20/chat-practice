plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.lanchat'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.lanchat"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 不引入任何第三方依赖，编译快、失败率低
